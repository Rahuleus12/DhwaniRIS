services:
  db:
      image: mariadb:10.6
      restart: unless-stopped
      ports:
        - "127.0.0.1:3306:3306"
      environment:
        MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        MARIADB_DATABASE: appdb
      volumes:
        - dbdata:/var/lib/mysql/data
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 256M
  proxy:
    image: nginx:1.25
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  volumes:
    dbdata:
